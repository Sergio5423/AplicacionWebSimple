server {
    listen 80;
    server_name localhost;

    # DNS interno de AWS (siempre es esta IP en todas las VPC)
    resolver 169.254.169.253 valid=30s;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Usar una variable obliga a Nginx a re-resolver el DNS
        set $backend_alb "http://internal-alb-private-2096393975.us-east-1.elb.amazonaws.com/";
        
        proxy_pass $backend_alb;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Tiempos de espera más largos para evitar el 502 por lentitud
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}