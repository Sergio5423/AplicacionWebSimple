<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header>
            <h1>Agenda Telefónica</h1>
        </header>

        <section class="card">
            <h2>Agregar contacto</h2>
            <form id="contactForm">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input id="nombre" name="nombre" type="text" placeholder="Ej: Juan" required>
                </div>
                <div class="form-group">
                    <label for="apellido">Apellido</label>
                    <input id="apellido" name="apellido" type="text" placeholder="Ej: Pérez">
                </div>
                <div class="form-group">
                    <label for="telefono">Teléfono</label>
                    <input id="telefono" name="telefono" type="tel" placeholder="+57 300...">
                </div>
                <div class="form-group">
                    <label for="correo">Correo electrónico</label>
                    <input id="correo" name="correo" type="email" placeholder="juan@ejemplo.com">
                </div>
                <button type="button" id="btnEnviar" class="btn-primary">Guardar Contacto</button>
            </form>
        </section>

        <hr>

        <section class="list-section">
            <div class="list-header">
                <h2>Lista de contactos</h2>
                <button id="btnCargar" class="btn-secondary">Actualizar</button>
            </div>
            <ul id="listaContactos" class="contact-grid">
                </ul>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
